[workspace]
resolver = "3"
members = ["crates/shoji-core", "crates/shoji-default", "crates/shoji-bar-4"]
default-members = ["crates/shoji-bar-4"]

[workspace.package]
version = "0.9.0"
edition = "2024"
description = "A Material 3 Expressive desktop shell for ShojiWM, built on AntiWebUI"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anti-webui = { git = "https://github.com/bea4dev/AntiWebUI.git", branch = "main", features = ["wayland-shell", "shell-network", "shell-battery", "shell-power-profiles", "shell-bluetooth", "shell-media", "shell-notifications", "shell-tray", "shell-session", "shell-audio", "shell-apps", "shell-process", "shell-system"] }
anti-webui-md3e = { git = "https://github.com/bea4dev/AntiWebUI.git", branch = "main" }
serde_json = "1"
shoji-core = { path = "crates/shoji-core" }
shoji-default = { path = "crates/shoji-default" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
# Function names stay, for `scripts/cpu-report.sh`; the debug info goes.
strip = "debuginfo"

# For working on an interface of your own: `cargo build --profile fast`. Without LTO, a change in the
# plugins directory only recompiles and links the small binary crate instead of optimising
# everything again. The binary is a little slower and bigger; for a shell that idles at 0% CPU
# that does not show. It lands in target/fast/.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
